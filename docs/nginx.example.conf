# Reference only. Include in nginx's http context after setting a real hostname/certificate.
limit_req_zone $binary_remote_addr zone=appscan_api:10m rate=10r/s;
server {
    listen 443 ssl;
    server_name appscan.example.internal;
    ssl_certificate /etc/nginx/tls/appscan.crt;
    ssl_certificate_key /etc/nginx/tls/appscan.key;
    client_max_body_size 58m;
    location /appscan/ {
        limit_req zone=appscan_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8089;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /appscan { return 308 /appscan/$is_args$args; }
}
